# promtool unit tests for config/monitoring/prometheusrule.yaml.
# Run with: make test-monitoring
rule_files:
  - rules.yaml
evaluation_interval: 1m

tests:
  - name: operator down when the target is missing or down
    interval: 1m
    input_series:
      - series: 'up{job="zabbix-operator-metrics"}'
        values: '1x5 0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ZabbixOperatorDown
        exp_alerts: []
      - eval_time: 12m
        alertname: ZabbixOperatorDown
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Zabbix operator is down
              description: No zabbix-operator metrics target has been up for 5 minutes.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixoperatordown

  - name: reconcile errors fire only when they persist
    interval: 1m
    input_series:
      - series: 'controller_runtime_reconcile_errors_total{job="zabbix-operator-metrics",controller="zabbixdatabase"}'
        values: '0+1x30'
      - series: 'controller_runtime_reconcile_errors_total{job="zabbix-operator-metrics",controller="other"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: ZabbixOperatorReconcileErrors
        exp_alerts: []
      - eval_time: 17m
        alertname: ZabbixOperatorReconcileErrors
        exp_alerts:
          - exp_labels: { severity: warning, controller: zabbixdatabase }
            exp_annotations:
              summary: Zabbix operator reconcile errors
              description: Controller zabbixdatabase has failed reconciles for 15 minutes.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixoperatorreconcileerrors

  - name: database not ready escalates from warning to critical
    interval: 1m
    input_series:
      - series: 'zabbix_operator_database_ready{namespace="zabbix",database="zabbix-db"}'
        values: '1x2 0x20'
      - series: 'zabbix_operator_database_ready{namespace="zabbix",database="healthy"}'
        values: '1x22'
    alert_rule_test:
      - eval_time: 7m
        alertname: ZabbixDatabaseNotReady
        exp_alerts: []
      - eval_time: 9m
        alertname: ZabbixDatabaseNotReady
        exp_alerts:
          - exp_labels: { severity: warning, namespace: zabbix, database: zabbix-db }
            exp_annotations:
              summary: Zabbix database not ready
              description: ZabbixDatabase zabbix/zabbix-db has not been Ready for 5 minutes.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixdatabasenotready
      - eval_time: 17m
        alertname: ZabbixDatabaseNotReady
        exp_alerts:
          - exp_labels: { severity: warning, namespace: zabbix, database: zabbix-db }
            exp_annotations:
              summary: Zabbix database not ready
              description: ZabbixDatabase zabbix/zabbix-db has not been Ready for 5 minutes.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixdatabasenotready
      - eval_time: 19m
        alertname: ZabbixDatabaseNotReady
        exp_alerts:
          - exp_labels: { severity: warning, namespace: zabbix, database: zabbix-db }
            exp_annotations:
              summary: Zabbix database not ready
              description: ZabbixDatabase zabbix/zabbix-db has not been Ready for 5 minutes.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixdatabasenotready
          - exp_labels: { severity: critical, namespace: zabbix, database: zabbix-db }
            exp_annotations:
              summary: Zabbix database not ready
              description: ZabbixDatabase zabbix/zabbix-db has not been Ready for 15 minutes.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixdatabasenotready

  - name: primary flapping
    interval: 1m
    input_series:
      - series: 'zabbix_operator_database_condition{namespace="zabbix",database="zabbix-db",condition="PrimaryStable",status="False"}'
        values: '0x2 1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: ZabbixDatabasePrimaryFlapping
        exp_alerts: []
      - eval_time: 14m
        alertname: ZabbixDatabasePrimaryFlapping
        exp_alerts:
          - exp_labels: { severity: warning, namespace: zabbix, database: zabbix-db, condition: PrimaryStable, status: "False" }
            exp_annotations:
              summary: Zabbix database primary is flapping
              description: The primary of zabbix/zabbix-db keeps changing.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixdatabaseprimaryflapping

  - name: no active server node, but not during an upgrade
    interval: 1m
    input_series:
      - series: 'zabbix_operator_server_active_nodes{namespace="zabbix",system="zabbix"}'
        values: '1x3 0x10'
      - series: 'zabbix_operator_system_phase{namespace="zabbix",system="zabbix",phase="Running"}'
        values: '1x13'
      - series: 'zabbix_operator_server_active_nodes{namespace="zabbix",system="upgrading"}'
        values: '0x13'
      - series: 'zabbix_operator_system_phase{namespace="zabbix",system="upgrading",phase="Running"}'
        values: '0x13'
      - series: 'zabbix_operator_system_phase{namespace="zabbix",system="upgrading",phase="Upgrading"}'
        values: '1x13'
    alert_rule_test:
      - eval_time: 5m
        alertname: ZabbixServerNoActiveNode
        exp_alerts: []
      - eval_time: 7m
        alertname: ZabbixServerNoActiveNode
        exp_alerts:
          - exp_labels: { severity: critical, namespace: zabbix, system: zabbix }
            exp_annotations:
              summary: No active Zabbix server node
              description: ZabbixSystem zabbix/zabbix has had no active server node for 2 minutes; proxies and agents cannot deliver data.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixservernoactivenode

  - name: failover storm
    interval: 1m
    input_series:
      - series: 'zabbix_operator_server_failovers_total{namespace="zabbix",system="zabbix"}'
        values: '0+1x6'
    alert_rule_test:
      - eval_time: 3m
        alertname: ZabbixServerFailoverStorm
        exp_alerts: []
      - eval_time: 6m
        alertname: ZabbixServerFailoverStorm
        exp_alerts:
          - exp_labels: { severity: warning, namespace: zabbix, system: zabbix }
            exp_annotations:
              summary: Zabbix server keeps failing over
              description: The active server of zabbix/zabbix changed more than 3 times in 30 minutes.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixserverfailoverstorm

  - name: component degraded
    interval: 1m
    input_series:
      - series: 'zabbix_operator_component_pods_ready{namespace="zabbix",system="zabbix",component="web"}'
        values: '2x3 1x15'
      - series: 'zabbix_operator_component_pods_desired{namespace="zabbix",system="zabbix",component="web"}'
        values: '2x18'
    alert_rule_test:
      - eval_time: 12m
        alertname: ZabbixComponentDegraded
        exp_alerts: []
      - eval_time: 15m
        alertname: ZabbixComponentDegraded
        exp_alerts:
          - exp_labels: { severity: warning, namespace: zabbix, system: zabbix, component: web }
            exp_annotations:
              summary: Zabbix component has fewer ready pods than desired
              description: Component web of zabbix/zabbix has had fewer ready pods than desired for 10 minutes.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixcomponentdegraded

  - name: failing pods
    interval: 1m
    input_series:
      - series: 'zabbix_operator_pod_replacements_total{namespace="zabbix",system="zabbix",component="web",reason="failed"}'
        values: '0+2x10'
      - series: 'zabbix_operator_pod_replacements_total{namespace="zabbix",system="zabbix",component="server",reason="rollout"}'
        values: '0+5x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: ZabbixPodReplacementsHigh
        exp_alerts: []
      - eval_time: 5m
        alertname: ZabbixPodReplacementsHigh
        exp_alerts:
          - exp_labels: { severity: warning, namespace: zabbix, system: zabbix, component: web, reason: failed }
            exp_annotations:
              summary: Zabbix pods keep failing
              description: More than 5 failed web pods of zabbix/zabbix were replaced in 30 minutes.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixpodreplacementshigh

  - name: upgrade blocked
    interval: 1m
    input_series:
      - series: 'zabbix_operator_upgrade_blocked{namespace="zabbix",system="zabbix",reason="PostgreSQLTooOld"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ZabbixUpgradeBlocked
        exp_alerts: []
      - eval_time: 31m
        alertname: ZabbixUpgradeBlocked
        exp_alerts:
          - exp_labels: { severity: warning, namespace: zabbix, system: zabbix, reason: PostgreSQLTooOld }
            exp_annotations:
              summary: Zabbix install or upgrade is blocked
              description: ZabbixSystem zabbix/zabbix has been blocked for 30 minutes (PostgreSQLTooOld); kubectl get zsys shows why.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixupgradeblocked

  - name: upgrade stuck
    interval: 1m
    input_series:
      - series: 'zabbix_operator_upgrade_in_progress{namespace="zabbix",system="zabbix"}'
        values: '1x130'
    alert_rule_test:
      - eval_time: 100m
        alertname: ZabbixUpgradeStuck
        exp_alerts: []
      - eval_time: 125m
        alertname: ZabbixUpgradeStuck
        exp_alerts:
          - exp_labels: { severity: warning, namespace: zabbix, system: zabbix }
            exp_annotations:
              summary: Zabbix upgrade is taking long
              description: ZabbixSystem zabbix/zabbix has been upgrading for more than 2 hours.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixupgradestuck

  - name: job failing
    interval: 1m
    input_series:
      - series: 'zabbix_operator_job_runs_total{namespace="zabbix",system="zabbix",job="ha-gc",result="failed"}'
        values: '0 0 1 1 2 2 2'
      - series: 'zabbix_operator_job_runs_total{namespace="zabbix",system="zabbix",job="ha-gc",result="succeeded"}'
        values: '0+3x6'
    alert_rule_test:
      - eval_time: 3m
        alertname: ZabbixOperatorJobFailing
        exp_alerts: []
      - eval_time: 6m
        alertname: ZabbixOperatorJobFailing
        exp_alerts:
          - exp_labels: { severity: warning, namespace: zabbix, system: zabbix, job: ha-gc, result: failed }
            exp_annotations:
              summary: Zabbix operator Job keeps failing
              description: The ha-gc Job of zabbix/zabbix failed at least twice in an hour.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixoperatorjobfailing

  - name: ha-gc stale only while running
    interval: 1m
    input_series:
      - series: 'zabbix_operator_hanode_gc_last_success_timestamp_seconds{namespace="zabbix",system="zabbix"}'
        values: '600x50'
      - series: 'zabbix_operator_system_phase{namespace="zabbix",system="zabbix",phase="Running"}'
        values: '1x50'
      - series: 'zabbix_operator_hanode_gc_last_success_timestamp_seconds{namespace="zabbix",system="upgrading"}'
        values: '600x50'
      - series: 'zabbix_operator_system_phase{namespace="zabbix",system="upgrading",phase="Running"}'
        values: '0x50'
      - series: 'zabbix_operator_system_phase{namespace="zabbix",system="upgrading",phase="Upgrading"}'
        values: '1x50'
    alert_rule_test:
      - eval_time: 42m
        alertname: ZabbixHANodeGCStale
        exp_alerts: []
      - eval_time: 46m
        alertname: ZabbixHANodeGCStale
        exp_alerts:
          - exp_labels: { severity: warning, namespace: zabbix, system: zabbix }
            exp_annotations:
              summary: Stale ha_node rows are not being removed
              description: ha-gc has not succeeded for 30 minutes on zabbix/zabbix.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixhanodegcstale

  - name: running watchdog follows ha-gc
    interval: 1m
    input_series:
      # Running from 2m; ha-gc succeeds at 3m and 8m, then stops.
      - series: 'zabbix_operator_system_phase{namespace="zabbix",system="zabbix",phase="Running"}'
        values: '0x2 1x30'
      - series: 'zabbix_operator_hanode_gc_last_success_timestamp_seconds{namespace="zabbix",system="zabbix"}'
        values: '_x3 180x5 480x25'
      # A degraded system with recent ha-gc runs must not send the heartbeat.
      - series: 'zabbix_operator_system_phase{namespace="zabbix",system="degraded",phase="Running"}'
        values: '0x32'
      - series: 'zabbix_operator_system_phase{namespace="zabbix",system="degraded",phase="Degraded"}'
        values: '1x32'
      - series: 'zabbix_operator_hanode_gc_last_success_timestamp_seconds{namespace="zabbix",system="degraded"}'
        values: '_x3 180x5 480x25'
    alert_rule_test:
      - eval_time: 2m
        alertname: ZabbixSystemRunning
        exp_alerts: []
      - eval_time: 10m
        alertname: ZabbixSystemRunning
        exp_alerts:
          - exp_labels: { severity: info, namespace: zabbix, system: zabbix, phase: Running }
            exp_annotations:
              summary: Zabbix system is running
              description: ZabbixSystem zabbix/zabbix is running and its ha-gc check succeeded within the last 10 minutes. This alert fires continuously as a heartbeat; its absence means the system is not running or its maintenance has stopped.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixsystemrunning
      - eval_time: 19m
        alertname: ZabbixSystemRunning
        exp_alerts: []

  - name: agent nodes missing
    interval: 1m
    input_series:
      - series: 'zabbix_operator_agent_nodes_ready{namespace="zabbix",system="zabbix"}'
        values: '5x3 4x20'
      - series: 'zabbix_operator_agent_nodes_desired{namespace="zabbix",system="zabbix"}'
        values: '5x23'
    alert_rule_test:
      - eval_time: 17m
        alertname: ZabbixAgentNodesMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: ZabbixAgentNodesMissing
        exp_alerts:
          - exp_labels: { severity: warning, namespace: zabbix, system: zabbix }
            exp_annotations:
              summary: Zabbix agents missing on some nodes
              description: The agent of zabbix/zabbix has been ready on fewer nodes than desired for 15 minutes.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixagentnodesmissing

  - name: proxy registration failing
    interval: 1m
    input_series:
      - series: 'zabbix_operator_proxy_registration_failing{namespace="zabbix",system="zabbix"}'
        values: '0x3 1x20'
    alert_rule_test:
      - eval_time: 17m
        alertname: ZabbixProxyRegistrationFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: ZabbixProxyRegistrationFailing
        exp_alerts:
          - exp_labels: { severity: warning, namespace: zabbix, system: zabbix }
            exp_annotations:
              summary: Zabbix proxy registration failing
              description: Proxy registration of zabbix/zabbix has failed for 15 minutes; new or changed proxies are not registered in Zabbix.
              runbook_url: https://github.com/sagh0900/zabbix-operator/blob/main/docs/alerts.md#zabbixproxyregistrationfailing
