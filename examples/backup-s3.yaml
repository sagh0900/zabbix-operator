# Continuous backup of the CNPG cluster to an S3-compatible object store with the
# barman-cloud plugin (installed next to the CloudNativePG operator). Schema upgrades wait
# for a recent completed Backup. Also add the plugin to the Cluster:
#
#   spec:
#     plugins:
#       - name: barman-cloud.cloudnative-pg.io
#         isWALArchiver: true
#         parameters: { barmanObjectName: zabbix-pg-s3 }
#
# Adding it restarts the PostgreSQL instances one at a time.
apiVersion: v1
kind: Secret
metadata:
  name: zabbix-pg-s3
  namespace: zabbix
stringData:
  ACCESS_KEY_ID: change-me
  ACCESS_SECRET_KEY: change-me
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: zabbix-pg-s3
  namespace: zabbix
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://zabbix-backups/
    endpointURL: https://s3.example.com     # omit for AWS
    s3Credentials:
      accessKeyId: { name: zabbix-pg-s3, key: ACCESS_KEY_ID }
      secretAccessKey: { name: zabbix-pg-s3, key: ACCESS_SECRET_KEY }
    wal: { compression: lz4 }
    data: { compression: lz4, jobs: 2 }      # gzip compresses on one core and is many times slower
  instanceSidecarConfiguration:
    env:                                     # for S3-compatible stores other than AWS
      - { name: AWS_DEFAULT_REGION, value: default }
      - { name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required }
      - { name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: zabbix-pg-daily
  namespace: zabbix
spec:
  schedule: "0 0 2 * * *"                    # seconds first: 02:00 every day
  backupOwnerReference: self
  cluster: { name: zabbix-pg }
  method: plugin
  pluginConfiguration: { name: barman-cloud.cloudnative-pg.io }
