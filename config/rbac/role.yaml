  resources:
  - backups
  - clusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - zabbix.io
  resources:
  - zabbixdatabases
  - zabbixsystems
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - zabbix.io
  resources:
  - zabbixdatabases/status
  - zabbixsystems/status
  verbs:
  - get
  - patch
  - update
