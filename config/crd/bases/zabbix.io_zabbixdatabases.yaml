---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: zabbixdatabases.zabbix.io
spec:
  group: zabbix.io
  names:
    kind: ZabbixDatabase
    listKind: ZabbixDatabaseList
    plural: zabbixdatabases
    shortNames:
    - zdb
    singular: zabbixdatabase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .status.currentPrimary
      name: Primary
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ZabbixDatabase is a read-only view of a CloudNativePG cluster
          used by Zabbix.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZabbixDatabaseSpec references a CloudNativePG cluster and
              the credentials Zabbix uses.
            properties:
              clusterRef:
                description: ClusterRef names the CNPG Cluster in the same namespace.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              credentialsRef:
                description: |-
                  CredentialsRef points at the Secret holding the database user and password,
                  typically the passwordSecret of a CNPG managed role.
                properties:
                  passwordKey:
                    default: password
                    type: string
                  secretName:
                    minLength: 1
                    type: string
                  usernameKey:
                    default: username
                    type: string
                required:
                - secretName
                type: object
              database:
                default: zabbix
                description: Database is the name of the Zabbix database.
                type: string
              directHost:
                description: |-
                  DirectHost is the host used for schema work. It must reach the primary directly,
                  never through a transaction pooler. Defaults to <cluster>-rw.
                type: string
              flap:
                description: Flap configures primary-change damping.
                properties:
                  threshold:
                    default: 3
                    description: |-
                      Threshold is the number of primary changes within Window that marks the
                      primary unstable.
                    minimum: 1
                    type: integer
                  window:
                    default: 10m
                    description: Window is the sliding window for counting primary
                      changes.
                    type: string
                type: object
              host:
                description: |-
                  Host is the database host Zabbix connects to, for example a Pooler Service.
                  Defaults to <cluster>-rw.
                type: string
              port:
                default: 5432
                description: Port of Host and DirectHost.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              tls:
                description: TLS configures client TLS to PostgreSQL.
                properties:
                  caSecretRef:
                    description: |-
                      CASecretRef selects the CA certificate that signs the server certificate.
                      Required for verify-ca and verify-full.
                    properties:
                      key:
                        minLength: 1
                        type: string
                      name:
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  clientCertSecretRef:
                    description: ClientCertSecretRef names a kubernetes.io/tls Secret
                      with a client certificate.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  mode:
                    description: Mode is the libpq sslmode.
                    enum:
                    - require
                    - verify-ca
                    - verify-full
                    type: string
                required:
                - mode
                type: object
            required:
            - clusterRef
            - credentialsRef
            type: object
          status:
            description: ZabbixDatabaseStatus reports whether Zabbix may connect to
              the database.
            properties:
              conditions:
                description: 'Conditions: ClusterReady, CredentialsReady, PrimaryStable,
                  Ready.'
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentPrimary:
                description: CurrentPrimary is the pod name of the current primary.
                type: string
              lastPrimaryChange:
                description: LastPrimaryChange is when the primary last changed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status was computed
                  for.
                format: int64
                type: integer
              phase:
                description: Phase mirrors the phase reported by CNPG.
                type: string
              primaryChanges:
                description: PrimaryChanges counts primary changes in the current
                  flap window.
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: spec.tls.caSecretRef is required for verify-ca and verify-full
          rule: '!has(self.spec.tls) || self.spec.tls.mode == ''require'' || has(self.spec.tls.caSecretRef)'
    served: true
    storage: true
    subresources:
      status: {}
