namespace: zabbix-operator
namePrefix: zabbix-operator-
labels:
  - pairs:
      app.kubernetes.io/part-of: zabbix-operator
    includeSelectors: false
resources:
  - ../crd
  - ../rbac
  - ../manager
replacements:
  # Database Jobs run the operator image; keep OPERATOR_IMAGE equal to it.
  - source:
      kind: Deployment
      name: controller-manager
      fieldPath: spec.template.spec.containers.[name=manager].image
    targets:
      - select:
          kind: Deployment
          name: controller-manager
        fieldPaths:
          - spec.template.spec.containers.[name=manager].env.[name=OPERATOR_IMAGE].value
