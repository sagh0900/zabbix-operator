# Grants the scraping Prometheus access to /metrics. Patch the subject to the
# ServiceAccount of your Prometheus (for kube-prometheus-stack:
# <release>-kube-prometheus-prometheus in its namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-reader-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zabbix-operator-metrics-reader
subjects:
  - kind: ServiceAccount
    name: prometheus-k8s
    namespace: monitoring
