# Optional monitoring for the operator. Requires the Prometheus Operator CRDs.
# Overlays add the labels your Prometheus selects ServiceMonitors and rules by.
namespace: zabbix-operator
namePrefix: zabbix-operator-
labels:
  - pairs:
      app.kubernetes.io/part-of: zabbix-operator
    includeSelectors: false
resources:
  - servicemonitor.yaml
  - prometheusrule.yaml
  - prometheus_rolebinding.yaml
configMapGenerator:
  - name: dashboard
    files:
      - zabbix-operator.json=dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
