apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: metrics
  namespace: system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zabbix-operator
  endpoints:
    - port: https
      scheme: https
      path: /metrics
      interval: 30s
      # Series carry the namespace of the ZabbixSystem or ZabbixDatabase they describe;
      # without this, Prometheus replaces it with the operator pod's namespace.
      honorLabels: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # The operator serves a self-signed certificate.
        insecureSkipVerify: true
