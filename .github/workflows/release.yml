name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches VERSION
        id: meta
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zabbix-operator:${{ github.ref_name }}
          cache-from: type=gha
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          # GitHub links a multi-platform package to its repository through the index
          # annotations, not the per-platform image labels.
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.description=Kubernetes operator for Zabbix on CloudNativePG
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.version=${{ github.ref_name }}
            index:org.opencontainers.image.revision=${{ github.sha }}

      - name: Render install.yaml, monitoring.yaml and dashboard.json
        run: make build-installer IMG=ghcr.io/${{ github.repository_owner }}/zabbix-operator:${{ github.ref_name }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/zabbix-operator
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > notes.md <<NOTES
          ## Image

          \`${IMAGE}:${GITHUB_REF_NAME}\` (linux/amd64, linux/arm64)

          \`\`\`
          docker pull ${IMAGE}:${GITHUB_REF_NAME}
          # pinned: ${IMAGE}@${DIGEST}
          \`\`\`

          ## Install

          \`\`\`
          kubectl apply -f https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.yaml
          \`\`\`
          NOTES
          gh release create "${GITHUB_REF_NAME}" --verify-tag --notes-file notes.md --generate-notes \
            dist/install.yaml dist/monitoring.yaml dist/dashboard.json
