version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - path: api/
        linters: [lll]
      - path: internal/
        linters: [dupl, lll]
      - path: _test\.go
        linters: [goconst]

formatters:
  enable:
    - gofmt
    - goimports
